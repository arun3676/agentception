<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Option 2 comparison</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; background: #111; color: #fff; font-family: Arial, sans-serif; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .panel { padding: 10px; border: 1px solid #3a3a3a; border-radius: 12px; background: #1c1c1c; }
    .label { margin: 0 0 8px; color: #d8d8d8; font-size: 13px; font-weight: 700; }
    .frame { height: 500px; display: flex; align-items: flex-start; justify-content: center; overflow: hidden; border-radius: 8px; background: #000; }
    .frame img { width: 100%; height: 100%; object-fit: contain; object-position: top center; }
  </style>
</head>
<body>
  <main class="grid">
    <section class="panel">
      <p class="label">SOURCE — selected option 2</p>
      <div class="frame"><img src="http://localhost:4322/exec-7c6b470c-0ca4-4f99-9330-cb9c523998ba.png" alt="Selected option 2 source design"></div>
    </section>
    <section class="panel">
      <p class="label">IMPLEMENTATION — desktop 1440 × 1024</p>
      <div class="frame"><img src="./landing-desktop-1440x1024-v2.png" alt="Rendered desktop landing page"></div>
    </section>
  </main>
</body>
</html>
