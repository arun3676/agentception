name: Keep Supabase Alive

on:
  schedule:
    # Run every 6 hours (GitHub Actions free tier supports this)
    - cron: '0 */6 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Railway health endpoint
        run: |
          curl -sS --fail \
            "https://agentception1809.up.railway.app/health" \
            || echo "Health check failed — app may be down but workflow will continue"
        # The curl above hits the /health endpoint which queries Supabase,
        # resetting the 7-day auto-pause timer.
