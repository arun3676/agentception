name: Agent PR Check

# Paths are relative to the repo root, which is now the monorepo root:
# the app moved from `./` to `./agentception/` when the landing page, docs and
# eval workflows became siblings of it.

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentception
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall server

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentception/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: agentception/ui/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
