name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentception
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agentception/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Unit tests
        # No API keys are set here on purpose: the unit suite must never depend on
        # a paid service. If a test starts needing one, it belongs in evals/.
        run: python -m pytest -q --strict-markers

  frontend:
    name: Frontend — typecheck, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentception/ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: agentception/ui/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run lint
      - run: npm run build

  evals:
    name: Evals — quality metrics (offline)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentception
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agentception/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Quality metrics vs golden set
        # `-m eval` only: deterministic, offline, no paid calls. The golden set is
        # committed, so this gates skill-extraction F1, match AUROC and resume
        # parsing accuracy on every push.
        run: python -m pytest evals/ -m eval -q --strict-markers

      - name: Publish metrics to the job summary
        if: always()
        run: |
          if [ -f evals/report.md ]; then
            echo "## Quality metrics" >> $GITHUB_STEP_SUMMARY
            cat evals/report.md >> $GITHUB_STEP_SUMMARY
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: |
            agentception/evals/report.md
            agentception/evals/report.json
