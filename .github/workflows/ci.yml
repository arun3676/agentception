name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy:
    name: Privacy and secret hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.15"

      - name: Reject private fixtures and generated browser artifacts
        run: python agentception/scripts/check_repository_privacy.py

      - name: Scan the pull request for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  backend:
    name: Backend - tests and supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agentception
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.15"

      - name: Install uv
        run: python -m pip install uv==0.11.28

      - name: Verify and install the lock
        run: uv lock --check && uv sync --locked --group dev

      - name: Unit tests
        # No API keys are set here on purpose: the unit suite must never depend on
        # a paid service. If a test starts needing one, it belongs in evals/.
        run: uv run --locked python -m pytest -q --strict-markers

      - name: Export production dependency lock
        run: uv export --quiet --locked --no-dev --no-emit-project --format requirements.txt --output-file requirements-production.txt

      - name: Audit production dependency lock
        run: uv run --locked pip-audit --strict --require-hashes --disable-pip --requirement requirements-production.txt

      - name: Static security analysis
        run: uv run --locked bandit -q -r server -x server/tests -ll

      - name: Generate production Python CycloneDX SBOM
        if: always()
        run: uv export --quiet --locked --no-dev --format cyclonedx1.5 --output-file sbom-python.cdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: python-production-sbom
          path: agentception/sbom-python.cdx.json
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Frontend - tests, build, and supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agentception/ui
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agentception/ui/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm exec tsc -- --noEmit -p tsconfig.app.json

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
        env:
          VITE_BACKEND_URL: https://api.example.invalid

      - name: Enforce bundle budget
        run: npm run check:bundle

      - name: Audit production dependency lock
        run: npm audit --omit=dev --audit-level=moderate

      - name: Generate frontend CycloneDX SBOM
        if: always()
        run: npm sbom --omit=dev --package-lock-only --sbom-format=cyclonedx > sbom-frontend.cdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: frontend-production-sbom
          path: agentception/ui/sbom-frontend.cdx.json
          if-no-files-found: error
          retention-days: 14

  evals:
    name: Evals - offline quality metrics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agentception
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.15"

      - name: Install uv
        run: python -m pip install uv==0.11.28

      - name: Verify and install the lock
        run: uv lock --check && uv sync --locked --group dev

      - name: Quality metrics vs golden set
        # `-m eval` only: deterministic, offline, no paid calls. The golden set is
        # committed, so this gates skill extraction, ranking, and parsing regressions.
        run: uv run --locked python -m pytest evals/ -m eval -q --strict-markers

      - name: Publish metrics to the job summary
        if: always()
        run: |
          if [ -f evals/report.md ]; then
            echo "## Quality metrics" >> "$GITHUB_STEP_SUMMARY"
            cat evals/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: eval-report
          path: |
            agentception/evals/report.md
            agentception/evals/report.json
          if-no-files-found: error
          retention-days: 14

  e2e:
    name: Containment browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agentception
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.15"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            agentception/package-lock.json
            agentception/ui/package-lock.json

      - name: Install uv and locked Python dependencies
        run: python -m pip install uv==0.11.28 && uv lock --check && uv sync --locked --group dev

      - name: Install locked browser dependencies
        run: npm ci && npm --prefix ui ci

      - name: Install Chromium system dependencies
        run: npm exec playwright -- install --with-deps chromium

      - name: Run deterministic local browser tests
        run: uv run --locked npm exec playwright -- test

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: containment-e2e-failures
          path: agentception/test-results/playwright
          if-no-files-found: ignore
          retention-days: 7
