name: Nightly evals (LLM judge)

# Judge-based evals cost money and are non-deterministic, so they never gate a
# push. They run on a schedule and can be triggered by hand.
on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily
  workflow_dispatch:

jobs:
  judge:
    name: Study relevance (LLM-as-judge)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentception
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agentception/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Judge evals
        run: python -m pytest evals/ -m judge -q --strict-markers

      - name: Publish metrics
        if: always()
        run: |
          if [ -f evals/report.md ]; then
            echo "## Nightly judge metrics" >> $GITHUB_STEP_SUMMARY
            cat evals/report.md >> $GITHUB_STEP_SUMMARY
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-eval-report
          path: agentception/evals/report.json
