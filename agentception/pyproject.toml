[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentception"
version = "0.1.1"
description = "Evidence-oriented job discovery with a FastAPI backend"
readme = "README.md"
authors = [{ name = "Arun Kumar Chukkala" }]
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "openai>=1.40.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.0",
  "PyJWT[crypto]>=2.10.1",
  "pyyaml>=6.0.2",
  "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
  "bandit>=1.8.0",
  "cyclonedx-bom>=7.0.0",
  "numpy>=1.26.0",
  "pdfplumber>=0.11.0",
  "pip-audit>=2.9.0",
  "pymupdf>=1.24.0",
  "pypdf>=5.0.0",
  "pytest>=8.0.0",
  "reportlab>=4.0.0",
  "scikit-learn>=1.4.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
# Explicit paths: pytest imports every `test_*.py` it discovers, and a stray
# script that calls an API at import time would then run on every test invocation.
# `evals/` is deliberately excluded — it measures model quality against a golden
# set (slow, some of it paid) and is invoked explicitly: `pytest evals/`.
testpaths = ["server/tests", "server/agents"]
python_files = ["test_*.py"]
addopts = "--strict-markers"
markers = [
  "eval: offline quality metric against the golden set (runs in CI)",
]
